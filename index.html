    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='black'%3E%3Cpath d='M12 1.5l2.6 1.1 2.8-.5 1.7 2.3 2.7 1.1-.3 2.8 2.2 1.8-1.2 2.6 1.2 2.6-2.2 1.8.3 2.8-2.7 1.1-1.7 2.3-2.8-.5-2.6 1.1-2.6-1.1-2.8.5-1.7-2.3-2.7-1.1.3-2.8-2.2-1.8 1.2-2.6-1.2-2.6 2.2-1.8-.3-2.8 2.7-1.1 1.7-2.3 2.8.5z'/%3E%3Cpath fill='white' d='M10 15.5l-4-4 1.5-1.5 2.5 2.5 6-6 1.5 1.5z'/%3E%3C/svg%3E">
    
    <style>
        @font-face {
            font-family: mono;
            src: url(mono.ttf);
        }
        @font-face {
            font-family: derk;
            src: url(derk.otf);
        }
        
        :root {
            --main-text-color: #ffffff;
            --main-text-shadow: 0 4px 15px rgba(0, 0, 0, 1), 0 0 5px rgba(0, 0, 0, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: mono, sans-serif;
            background: #000;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent; 
            min-height: 100vh; 
            min-width: 100vw;
        }

        .unselectable {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .undraggable {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            transform: translateZ(0); 
            -webkit-transform: translateZ(0);
            backface-visibility: hidden;
            perspective: 1000;
            pointer-events: none;
        }

        .video-overlay-tint {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.35);
            z-index: 5;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        .overlay label {
            color: #fff;
            cursor: pointer;
            display: grid;
            place-items: center;
            width: 100%;
            height: 100%;
        }

        .overlay-text {
            font-size: clamp(1rem, 4vw, 1.2rem);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .no-hover { display: block; }
        .hover { display: none; }
        
        @media(hover:hover) {
            .hover { display: block; }
            .no-hover { display: none; }
        }

        #overlay-toggle {
            display: none;
        }

        #overlay-toggle:checked ~ .overlay {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .views-container {
            position: fixed;
            top: clamp(15px, 3vh, 25px);
            left: clamp(15px, 3vw, 25px);
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            letter-spacing: 1px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
        }

        #overlay-toggle:checked ~ .views-container {
            opacity: 1;
            visibility: visible;
        }

        .views-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
        }

        .views-icon svg {
            width: 100%;
            height: 100%;
        }

        .text-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            padding: 0 20px;
        }

        .main-title {
            font-family: derk, sans-serif;
            color: var(--main-text-color);
            text-shadow: var(--main-text-shadow);
            font-size: clamp(3.5rem, 12vw, 6rem);
            font-weight: 800;
            margin-bottom: 1rem;
            letter-spacing: 3px;
            pointer-events: none;
        }

        .socials {
            display: flex;
            gap: clamp(15px, 4vw, 35px);
            z-index: 15;
            flex-wrap: wrap;
            justify-content: center;
        }

        .social-link {
            text-decoration: none;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            color: #ccc;
            text-shadow: 0 2px 5px rgba(0,0,0,1);
            transition: color 0.3s ease, transform 0.3s ease, text-shadow 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .social-link svg {
            width: clamp(16px, 3.5vw, 20px);
            height: clamp(16px, 3.5vw, 20px);
            transition: transform 0.3s ease;
        }

        .social-link:hover {
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .social-link:hover svg {
            transform: scale(1.1);
        }

        .controls-container {
            position: fixed;
            bottom: clamp(20px, 5vh, 40px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: clamp(12px, 2vw, 20px);
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 24px;
            border-radius: 40px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.8);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease, transform 0.3s ease;
            width: max-content;
            max-width: 95vw;
        }

        #overlay-toggle:checked ~ .controls-container {
            opacity: 1;
            visibility: visible;
        }

        .controls-container:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateX(-50%) scale(1.02);
        }

        .divider {
            width: 1px;
            height: 24px;
            background: rgba(255, 255, 255, 0.3);
            margin: 0 clamp(5px, 1vw, 10px);
        }

        .time-display {
            color: #fff;
            font-size: clamp(0.75rem, 1.5vw, 0.95rem);
            letter-spacing: 1px;
            font-variant-numeric: tabular-nums;
            opacity: 0.9;
            white-space: nowrap;
        }

        .control-slider {
            -webkit-appearance: none;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            transition: background 0.3s;
        }

        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(0,0,0,0.8);
            transition: transform 0.2s;
        }

        .control-slider::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        #volume-slider {
            width: clamp(50px, 10vw, 80px);
        }

        .control-icon {
            color: #fff;
            cursor: pointer;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .control-icon svg {
            width: 100%;
            height: 100%;
        }

        .control-icon:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px), (hover: none) and (pointer: coarse) {
            #volume-slider, #mute-icon, .divider {
                display: none !important;
            }
            .controls-container {
                padding: 12px 24px;
            }
        }
    </style>
</head>
<body>

    <script>
        const video = document.getElementById("video");
        const volumeSlider = document.getElementById("volume-slider");
        const muteIcon = document.getElementById("mute-icon");
        const playPauseBtn = document.getElementById("play-pause-btn");
        const timeDisplay = document.getElementById("time-display");
        const overlayToggle = document.getElementById("overlay-toggle");
        
        let lastVolume = 0.5;
        let formattedDuration = "0:00";

        const svgPlay = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
        const svgPause = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>';
        const svgVolHigh = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>';
        const svgVolLow = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>';
        const svgVolMute = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>';

        async function initViewCounter() {
            const viewsCountEl = document.getElementById("views-count");
            const namespace = "mateee_website_views_global_final_01"; 
            
            // Háromszoros védelem lekérése
            const hasSession = sessionStorage.getItem("mate_visited");
            const hasLocal = localStorage.getItem("mate_visited");
            const hasCookie = document.cookie.includes("mate_visited=true");

            if (!hasSession && !hasLocal && !hasCookie) {
                try {
                    const response = await fetch(`https://api.counterapi.dev/v1/${namespace}/visits/up`);
                    const data = await response.json();
                    viewsCountEl.innerText = data.count;
                    
                    sessionStorage.setItem("mate_visited", "true");
                    localStorage.setItem("mate_visited", "true");
                    document.cookie = "mate_visited=true; max-age=31536000; path=/";
                } catch (error) {
                    viewsCountEl.innerText = "1";
                }
            } else {
                try {
                    const response = await fetch(`https://api.counterapi.dev/v1/${namespace}/visits`);
                    const data = await response.json();
                    viewsCountEl.innerText = data.count;
                    
                    sessionStorage.setItem("mate_visited", "true");
                    localStorage.setItem("mate_visited", "true");
                    if (!hasCookie) document.cookie = "mate_visited=true; max-age=31536000; path=/";
                } catch (error) {
                    viewsCountEl.innerText = "1";
                }
            }
        }

        document.addEventListener("DOMContentLoaded", initViewCounter);

        if (video) {
            video.addEventListener('loadedmetadata', () => {
                let minutes = Math.floor(video.duration / 60);
                let seconds = Math.floor(video.duration % 60);
                formattedDuration = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
                timeDisplay.innerText = "0:00 / " + formattedDuration;
            });
        }

        function startMedia() {
            if (video) {
                video.currentTime = 0;
                video.muted = false;
                
                if(window.innerWidth > 768) {
                    video.volume = volumeSlider.value;
                } else {
                    video.volume = 1;
                }
                
                let playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        playPauseBtn.innerHTML = svgPause;
                    }).catch(() => {
                        video.muted = true;
                        video.play().then(() => {
                            playPauseBtn.innerHTML = svgPause;
                            if(window.innerWidth > 768) {
                                volumeSlider.value = 0;
                                updateVolume(0);
                            }
                        }).catch(() => {});
                    });
                }
            }
        }

        function togglePlay() {
            if (video) {
                if (video.paused) {
                    video.play();
                    playPauseBtn.innerHTML = svgPause;
                } else {
                    video.pause();
                    playPauseBtn.innerHTML = svgPlay;
                }
            }
        }

        function updateVolume(val) {
            if (video) {
                video.volume = val;
                video.muted = false; 
            }
            if (val == 0) {
                muteIcon.innerHTML = svgVolMute;
            } else if (val < 0.5) {
                muteIcon.innerHTML = svgVolLow;
            } else {
                muteIcon.innerHTML = svgVolHigh;
            }
        }

        function toggleMute() {
            if (video) {
                if (video.volume > 0) {
                    lastVolume = video.volume;
                    volumeSlider.value = 0;
                    updateVolume(0);
                } else {
                    volumeSlider.value = lastVolume || 0.5;
                    updateVolume(lastVolume || 0.5);
                }
            }
        }

        if (video) {
            video.addEventListener('timeupdate', () => {
                let minutes = Math.floor(video.currentTime / 60);
                let seconds = Math.floor(video.currentTime % 60);
                let formattedTime = minutes + ":" + (seconds < 10 ? "0" : "") + seconds;
                
                timeDisplay.innerText = formattedTime + " / " + formattedDuration;
            });

            video.addEventListener('play', () => {
                playPauseBtn.innerHTML = svgPause;
            });

            video.addEventListener('pause', () => {
                playPauseBtn.innerHTML = svgPlay;
            });
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                if (overlayToggle.checked) {
                    event.preventDefault();
                    togglePlay();
                }
            }
        });

        document.addEventListener('contextmenu', event => event.preventDefault());
    </script>
</body>
