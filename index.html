<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>mateee</title>

    <meta name="description" content="mateee.xyz">
    <meta name="keywords" content="mateee, tiktok, instagram, spotify">
    <meta name="author" content="mateee">

    <meta name="theme-color" content="#000000">

    <meta property="og:type" content="website">
    <meta property="og:title" content="mateee">
    <meta property="og:description" content="mateee.xyz">
    <meta property="og:url" content="https://mateee.xyz">
    <meta property="og:image" content="https://mateee.xyz/Image.jpg">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="mateee">
    <meta name="twitter:description" content="mateee.xyz">
    <meta name="twitter:image" content="https://mateee.xyz/Image.jpg">

    <link rel="stylesheet" href="Style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>

    <div id="overlay" class="overlay">
        <button id="enterButton" class="enter-button">
            Tap to Enter...
        </button>
    </div>

    <div id="viewCounter" class="view-counter">
        <svg viewBox="0 0 24 24">
            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zm0 10.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/>
        </svg>

        <span id="viewCount">...</span>
    </div>

    <video
        id="backgroundVideo"
        class="background-video"
        preload="metadata"
        loop
        playsinline
        webkit-playsinline
        muted>

        <source src="Video.mp4" type="video/mp4">

    </video>

    <div class="video-overlay"></div>

    <main class="main-container">

        <div class="content-card">

            <h1 class="main-title">
                mateee
            </h1>

            <div class="social-links">

                <a
                    href="https://www.instagram.com/definitelynotmate_?igsh=N2dpdXp6bHRyYjJt&utm_source=qr"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-link">

                    Instagram
                </a>

                <a
                    href="https://www.tiktok.com/@mateww__?_r=1&_t=ZN-96fNFKdJZax"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-link">

                    TikTok
                </a>

                <a
                    href="https://open.spotify.com/user/3137pwuzjp2ah6b57eaf6gtvdosi"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="social-link">

                    Spotify
                </a>

            </div>

        </div>

    </main>

    <div id="playerControls" class="player-controls">

        <button id="playPauseButton" class="control-button">
            ⏸
        </button>

        <span id="timeDisplay" class="time-display">
            0:00 / 0:00
        </span>

        <input
            type="range"
            id="volumeSlider"
            class="volume-slider"
            min="0"
            max="1"
            step="0.01"
            value="0.5">

    </div>

    <script src="Javascript.js"></script>

</body>
</html>
